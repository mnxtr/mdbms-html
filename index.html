<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>FactoryOS | Manufacturing Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">F</span><div><strong>FactoryOS</strong><small>Manufacturing Intelligence</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-view="overview">⌂ <span>Overview</span></button>
        <button class="nav-item" data-view="production">◫ <span>Production</span></button>
        <button class="nav-item" data-view="inventory">▤ <span>Inventory</span></button>
        <button class="nav-item" data-view="maintenance">⚙ <span>Maintenance</span></button>
        <button class="nav-item" data-view="knowledge">◈ <span>Knowledge</span></button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span> Demo factory connected</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
        <div><span class="eyebrow">Factory 01 / Dhaka</span><h1 id="pageTitle">Operations overview</h1></div>
        <div class="top-actions"><span class="live"><i></i> Live data</span><button class="avatar">MN</button></div>
      </header>

      <section class="content">
        <div id="view-overview" class="view active"></div>
        <div id="view-production" class="view"></div>
        <div id="view-inventory" class="view"></div>
        <div id="view-maintenance" class="view"></div>
        <div id="view-knowledge" class="view"></div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
